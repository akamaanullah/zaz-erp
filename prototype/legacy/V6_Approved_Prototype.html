function godownQty(item){return db.receipts.filter(x=>x.item===item).reduce((s,x)=>s+x.qty,0)-db.transfers.filter(x=>x.item===item).reduce((s,x)=>s+x.qty,0)}function farmQty(farmName,item){return db.transfers.filter(x=>x.farm===farmName&&x.item===item&&x.received!=null).reduce((s,x)=>s+x.received,0)-db.usage.filter(x=>x.farm===farmName&&x.item===item).reduce((s,x)=>s+x.qty,0)}function rate(item){let rs=db.receipts.filter(x=>x.item===item);return rs.length?rs[rs.length-1].rate:0}function allExpenses(){return [...db.usage.map(x=>({...x,category:x.item,amount:x.qty*x.rate})),...db.expenses]};function split(x){return x.target==='seri'?0:Number(x.share)}function ledger(h){let sales=db.sales.filter(x=>x.hariId===h.id),cost=allExpenses().filter(x=>x.hariId===h.id),adv=db.advances.filter(x=>x.hariId===h.id),gross=sales.reduce((s,x)=>s+x.amount/2,0),ded=cost.reduce((s,x)=>s+x.amount*split(x)/100,0),advance=adv.reduce((s,x)=>s+x.amount,0);return {gross,ded,advance,balance:gross-ded-advance,sales,cost,adv}}function mark(x){return x.approved?'Approved':'Pending office approval'}

function attach(){let el=$('view');el.querySelectorAll('form').forEach(form=>form.onsubmit=e=>{e.preventDefault();try{submit(form.id,Object.fromEntries(new FormData(form).entries()));save();refresh()}catch(err){alert(err.message)}});el.querySelectorAll('[data-receive]').forEach(b=>b.onclick=()=>{let x=db.transfers.find(x=>x.id===b.dataset.receive);let q=prompt('Quantity actually received (sent '+x.qty+')',x.qty);if(q===null)return;q=Number(q);if(!Number.isFinite(q)||q<0||q>x.qty)return alert('Received quantity must be 0 to sent quantity');x.received=q;x.receivedBy=role();x.receivedAt=new Date().toLocaleString();save();refresh()});el.querySelectorAll('[data-printreceipt]').forEach(b=>b.onclick=()=>printReceipt(b.dataset.printreceipt));el.querySelectorAll('[data-printledger]').forEach(b=>b.onclick=()=>printLedger(b.dataset.printledger));if($('approveAll'))$('approveAll').onclick=()=>{[...db.usage,...db.expenses,...db.sales,...db.advances].filter(x=>x.farm===farm()).forEach(x=>x.approved=true);save();refresh()};if($('exportData'))$('exportData').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='farm-erp-demo-backup.json';a.click();URL.revokeObjectURL(a.href)}}
function submit(id,d){let fs=farm(),ss=season(),who=role(),num=x=>Number(x);if(id==='addHari'){let acres=num(d['Physical assigned acres']);if(acres<=0||acres>25)throw Error('Maximum 25 acres per Hari');db.haris.push({id:uid(),farm:fs,name:d.Name,address:d.Address,alloc:[{crop:d.Crop,acres,season:d.Season}]})}if(id==='addAlloc'){let h=getHari(d.Hari),acres=num(d.Acres);if(!h||acres<=0||h.alloc.reduce((s,a)=>s+a.acres,0)+acres>25)throw Error('Hari exceeds 25 acres; assignment blocked');h.alloc.push({crop:d.Crop,acres,season:d.Season})}if(id==='addReceipt'){let qty=num(d.Quantity),r=num(d['Office Rate']);if(qty<=0||r<0)throw Error('Invalid quantity or rate');db.receipts.push({id:uid(),item:d.Item,qty,rate:r,date:new Date().toISOString().slice(0,10)})}if(id==='sendTransfer'){let qty=num(d.Quantity);if(qty<=0||qty>godownQty(d.Item))throw Error('Insufficient main godown stock');db.transfers.push({id:uid(),farm:d.Farm,item:d.Item,qty,received:null,date:new Date().toISOString().slice(0,10)})}if(id==='addUsage'){let qty=num(d.Quantity),item=d.Item;if(qty<=0||qty>farmQty(fs,item))throw Error('Insufficient farm stock');let target=d.Target,h=target==='seri'?null:getHari(target);if(target!=='seri'&&!h)throw Error('Select Hari');db.usage.push({id:uid(),farm:fs,season:ss,item,qty,rate:rate(item),target,hariId:h?.id,crop:d['Crop (for Hari)'],share:target==='seri'?0:db.rules[item]??50,by:who,approved:false})}if(id==='addExpense'){let amount=num(d.Amount),target=d.Target,h=target==='seri'?null:getHari(target);if(amount<=0)throw Error('Invalid amount');db.expenses.push({id:uid(),farm:fs,season:ss,category:d.Category,target,hariId:h?.id,crop:d.Crop,amount,share:target==='seri'?0:db.rules[d.Category],by:who,approved:false})}if(id==='addSale'){let amount=num(d['Sale Amount']),target=d.Target;if(amount<=0)throw Error('Invalid sale');db.sales.push({id:uid(),farm:fs,season:ss,target,hariId:target==='seri'?null:target,crop:d.Crop,amount,by:who,approved:false})}if(id==='addAdvance'){let amount=num(d.Amount);if(amount<=0)throw Error('Invalid advance');db.advances.push({id:uid(),farm:fs,season:ss,hariId:d.Hari,reason:d.Reason,amount,by:who,approved:false})}if(id==='addRule'){db.rules[d.Category]=num(d['Hari Share'])}}
function printReceipt(id){let x=db.transfers.find(x=>x.id===id);$('printview').innerHTML=`<div class="panel"><h2>Farm Stock Receiving Receipt</h2><p>Farm: ${esc(x.farm)} • Date: ${esc(x.receivedAt||x.date)} • Item: ${esc(x.item)}</p><p>Sent: ${x.qty} | Received: ${x.received} | Difference: ${x.qty-x.received}</p><p>Received by: ${esc(x.receivedBy||'—')}</p><p>Farm Supervisor Signature: __________________</p><p>Office Verification: __________________</p></div>`;window.print()}

 let h=getHari(id);if(!h)return alert('Hari not found');
 let l=ledger(h);
 let expenseRows=l.cost.map(x=>{let pct=split(x),portion=x.amount*pct/100;return `<tr><td>${esc(x.category||x.item||'Other')}</td><td>${esc(x.crop||'—')}</td><td>${x.qty!=null?Number(x.qty).toLocaleString('en-PK'):'—'}</td><td>${x.rate!=null?money(x.rate):'—'}</td><td>${money(x.amount)}</td><td>${pct}%</td><td>${money(portion)}</td></tr>`}).join('');
 let saleRows=l.sales.map(x=>`<tr><td>${esc(x.crop||'—')}</td><td>${money(x.amount)}</td><td>50%</td><td>${money(x.amount/2)}</td></tr>`).join('');
 let advRows=l.adv.map(x=>`<tr><td>${esc(x.reason||x.category||'Advance')}</td><td>${money(x.amount)}</td></tr>`).join('');
 let pending=[...l.sales,...l.cost,...l.adv].some(x=>!x.approved);
 $('printview').innerHTML=`<div class="panel" dir="rtl" lang="sd" style="font-family:Arial,sans-serif">
 <h2 style="text-align:center">هاري جو انفرادي حساب ڪتاب — تفصيلي بيان</h2>
